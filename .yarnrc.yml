nodeLinker: node-modules
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'

yarnPath: .yarn/releases/yarn-4.13.0.cjs

# `yarn npm audit` exceptions with no fix their dependents accept (review on every Backstage update):
# - 1240912 (GHSA-86w9-cpqp-85rv, node-forge <=1.4.0): via selfsigned in @backstage/backend-defaults,
#   only creates a local development certificate; it does not verify signatures.
# - 1241230 (GHSA-7mx3-vvmw-hjmv, @graphql-tools/utils <=12.0.0): via mockttp in
#   @backstage/backend-openapi-utils, which only starts test servers; nothing here serves GraphQL.
# - 1240853 (GHSA-c475-qrg2-pj4r, basic-ftp <=6.2.0): via get-uri in proxy-agent, only to download
#   a PAC script over ftp://; not even the newest get-uri accepts the fixed basic-ftp 6.
npmAuditIgnoreAdvisories:
  - '1240912'
  - '1241230'
  - '1240853'
